name: Papers Newsletter

on:
  schedule:
    - cron: '0 11 * * 2'
  workflow_dispatch:

# Necessário para o passo de keepalive empurrar o commit de timestamp.
permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python3 newsletter.py

      # O GitHub desativa workflows agendados após 60 dias sem atividade no repositório.
      # Um commit de timestamp a cada execução zera esse contador. Roda mesmo se o envio
      # falhar (`always()`), senão uma falha derrubaria o agendamento junto.
      - name: Keepalive (evita desativação do cron por inatividade)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run.txt
          if git diff --cached --quiet; then
            echo "Nada a commitar."
          else
            git commit -m "chore: keepalive $(date -u +%F)"
            git push
          fi
